  <style>
    .glossary-page {
      padding: var(--header-offset) 0 80px;
      min-height: 100vh;
    }

    .glossary-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }

    .glossary-header h1 {
      font-family: var(--font-display);
      font-size: var(--type-xl);
      line-height: var(--leading-tight);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--blueprint);
      margin-bottom: var(--space-2);
    }

    .glossary-header p {
      color: var(--ink-soft);
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .glossary-search-wrap {
      max-width: 520px;
      margin: 0 auto var(--space-3);
      position: relative;
    }

    .glossary-search {
      width: 100%;
      font-family: var(--font-body);
      font-size: 1.05rem;
      padding: 13px 20px 13px 40px;
      background: var(--bg);
      border: var(--border-thin) solid var(--rule-soft);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: border-color var(--motion-feedback) ease, box-shadow var(--motion-feedback) ease;
    }

    .glossary-search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-mute);
      pointer-events: none;
    }

    .glossary-search::placeholder {
      color: var(--text-muted);
    }

    .glossary-search:focus {
      border-color: var(--blueprint);
      box-shadow: 0 0 0 3px var(--blueprint-tint);
    }

    .glossary-search:focus-visible {
      outline: 2px solid var(--blueprint);
      outline-offset: 2px;
    }

    .glossary-alphabet {
      max-width: 720px;
      margin: 0 auto var(--space-4);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
    }

    .glossary-alpha-key {
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink-soft);
      border: 1px solid var(--rule-soft);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--motion-feedback) ease, color var(--motion-feedback) ease, background-color var(--motion-feedback) ease;
    }

    .glossary-alpha-key:hover:not(:disabled) {
      border-color: var(--blueprint);
      color: var(--blueprint);
    }

    .glossary-alpha-key.active {
      background: var(--blueprint);
      border-color: var(--blueprint);
      color: var(--bg);
    }

    .glossary-alpha-key:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .glossary-count {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: var(--space-4);
    }

    .glossary-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-width: 760px;
      margin: 0 auto;
    }

    .glossary-card {
      background: var(--bg);
      border: var(--border-thin) solid var(--rule-soft);
      border-radius: var(--radius);
      padding: var(--space-4);
      box-shadow: var(--shadow-soft);
      transition: border-color var(--motion-feedback) ease, box-shadow var(--motion-feedback) ease, transform var(--motion-feedback) ease;
    }

    .glossary-card:hover {
      border-color: var(--rule);
      box-shadow: var(--shadow-hard);
      transform: translate(-2px, -2px);
    }

    .glossary-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .glossary-letter {
      font-family: var(--font-display);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--ink-mute);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .glossary-term {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin: 0;
    }

    .glossary-type-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--rule-soft);
      background: var(--bg-surface);
      color: var(--ink-soft);
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .glossary-type-pill[data-type="Learn"] {
      border-color: var(--blueprint);
      color: var(--blueprint);
      background: var(--blueprint-tint);
    }

    .glossary-divider {
      height: 1px;
      background: var(--paper-rule);
      margin-bottom: var(--space-2);
    }

    .glossary-row {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .glossary-col {
      flex: 1;
      min-width: 200px;
    }

    .glossary-col-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-mute);
      margin-bottom: var(--space-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .glossary-col-label::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--planned);
      border: 1px solid var(--rule-soft);
    }

    .glossary-col-label.says::before {
      background: var(--planned);
    }

    .glossary-col-label.means::before {
      background: var(--complete);
      box-shadow: 0 0 0 2px var(--blueprint-tint);
    }

    .glossary-col-says {
      color: var(--ink-soft);
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.5;
    }

    .glossary-col-means {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 55ch;
    }

    .glossary-empty {
      text-align: center;
      padding: 56px 24px;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .glossary-empty strong { color: var(--ink); }
    .glossary-empty a { color: var(--blueprint); text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 768px) {
      .glossary-page {
        padding: calc(var(--header-offset) - 12px) 0 48px;
      }

      .glossary-card-head {
        flex-direction: column;
        gap: var(--space-2);
      }

      .glossary-row {
        flex-direction: column;
        gap: var(--space-3);
      }

      .glossary-card {
        padding: var(--space-3);
      }
    }
  </style>

  <script>
    (function () {
      var root = document.documentElement;
      var stored = localStorage.getItem('theme');
      if (stored) {
        root.setAttribute('data-theme', stored);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        root.setAttribute('data-theme', 'dark');
      } else {
        root.setAttribute('data-theme', 'light');
      }

      function updateIcon() {
        var icon = document.getElementById('themeIcon');
        if (!icon) return;
        icon.textContent = root.getAttribute('data-theme') === 'light' ? 'N' : 'D';
      }

      updateIcon();

      document.addEventListener('DOMContentLoaded', function () {
        updateIcon();

        var btn = document.getElementById('themeToggle');
        if (btn) {
          btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcon();
          });
        }

        var searchInput = document.getElementById('glossarySearch');
        var listEl = document.getElementById('glossaryList');
        var countEl = document.getElementById('glossaryCount');
        var alphaEl = document.getElementById('glossaryAlphabet');

        if (searchInput) {
          searchInput.setAttribute('placeholder', 'Search ' + GLOSSARY.length + ' terms…');
        }

        function escapeHtml(str) {
          var div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }

        var activeLetter = '';

        function letterOf(term) {
          var ch = (term || '').trim().charAt(0).toUpperCase();
          if (ch >= 'A' && ch <= 'Z') return ch;
          return '#';
        }

        function buildAlphabet() {
          if (!alphaEl) return;
          var letters = {};
          for (var i = 0; i < GLOSSARY.length; i++) {
            letters[letterOf(GLOSSARY[i].term)] = true;
          }
          var html = '';
          var order = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
          for (var j = 0; j < order.length; j++) {
            var L = order[j];
            if (letters[L]) {
              html += '<button type="button" class="glossary-alpha-key" data-letter="' + L + '" aria-label="Jump to ' + L + '">' + L + '</button>';
            } else {
              html += '<button type="button" class="glossary-alpha-key" data-letter="' + L + '" disabled aria-hidden="true">' + L + '</button>';
            }
          }
          alphaEl.innerHTML = html;
        }

        function setActiveLetter(letter) {
          activeLetter = letter;
          if (!alphaEl) return;
          var keys = alphaEl.querySelectorAll('.glossary-alpha-key');
          for (var i = 0; i < keys.length; i++) {
            keys[i].classList.toggle('active', !keys[i].disabled && keys[i].getAttribute('data-letter') === letter);
          }
        }

        function renderGlossary(filter) {
          var terms = GLOSSARY;
          if (filter) {
            var q = filter.toLowerCase();
            terms = terms.filter(function (t) {
              return t.term.toLowerCase().indexOf(q) !== -1 ||
                t.says.toLowerCase().indexOf(q) !== -1 ||
                t.means.toLowerCase().indexOf(q) !== -1;
            });
          } else if (activeLetter) {
            var target = activeLetter;
            terms = terms.filter(function (t) { return letterOf(t.term) === target; });
          }

          countEl.textContent = terms.length + ' of ' + GLOSSARY.length + ' terms';

          if (terms.length === 0) {
            listEl.innerHTML = '<div class="glossary-empty"><strong>No terms match.</strong><br>Try a different search, or <a href="#" id="glossaryReset">browse all terms</a>.</div>';
            var reset = document.getElementById('glossaryReset');
            if (reset) reset.addEventListener('click', function (e) {
              e.preventDefault();
              searchInput.value = '';
              setActiveLetter('');
              renderGlossary('');
              searchInput.focus();
            });
            return;
          }

          var html = '';
          for (var i = 0; i < terms.length; i++) {
            var t = terms[i];
            html += '<article class="glossary-card">';
            html += '<div class="glossary-card-head">';
            html += '<div><div class="glossary-letter">' + letterOf(t.term) + '</div><h2 class="glossary-term">' + escapeHtml(t.term) + '</h2></div>';
            html += '<span class="glossary-type-pill">term</span>';
            html += '</div>';
            html += '<div class="glossary-divider"></div>';
            html += '<div class="glossary-row">';
            html += '<div class="glossary-col">';
            html += '<div class="glossary-col-label says">What people say</div>';
            html += '<div class="glossary-col-says">"' + escapeHtml(t.says) + '"</div>';
            html += '</div>';
            html += '<div class="glossary-col">';
            html += '<div class="glossary-col-label means">What it actually means</div>';
            html += '<div class="glossary-col-means">' + escapeHtml(t.means) + '</div>';
            html += '</div>';
            html += '</div>';
            html += '</article>';
          }
          listEl.innerHTML = html;
        }

        // Support ?q= deep-links from the command palette and external sources.
        // Pre-populate the search box and filter to the matching term so the
        // user lands directly on the definition rather than the full list.
        var urlQ = '';
        try { urlQ = new URLSearchParams(window.location.search).get('q') || ''; } catch (_) {}
        if (urlQ && searchInput) {
          searchInput.value = urlQ;
        }

        buildAlphabet();
        renderGlossary(urlQ);

        if (alphaEl) {
          alphaEl.addEventListener('click', function (e) {
            var btn = e.target.closest('.glossary-alpha-key');
            if (!btn || btn.disabled) return;
            setActiveLetter(btn.getAttribute('data-letter'));
            searchInput.value = '';
            renderGlossary('');
            var firstCard = listEl.querySelector('.glossary-card');
            if (firstCard) firstCard.scrollIntoView({ block: 'start', behavior: 'smooth' });
          });
        }

        if (searchInput) {
          searchInput.addEventListener('input', function () {
            setActiveLetter('');
            renderGlossary(searchInput.value.trim());
          });
        }
      });
    })();
  </script>
